name: Release Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Cotabby.sln

      - name: Test
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64 folder
        run: >-
          dotnet publish src/Cotabby.App/Cotabby.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o artifacts/Cotabby-win-x64

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/Cotabby-win-x64.zip"
          Compress-Archive -Path "artifacts/Cotabby-win-x64/*" -DestinationPath $zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cotabby-win-x64
          path: artifacts/Cotabby-win-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/Cotabby-win-x64.zip
