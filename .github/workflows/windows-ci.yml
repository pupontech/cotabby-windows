name: Windows verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Cotabby.sln

      - name: Test
        run: >-
          dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj
          -c Release --no-restore
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory artifacts/test-results

      - name: Build Windows application
        run: dotnet build src/Cotabby.App/Cotabby.App.csproj -c Release --no-restore

      - name: Exercise Windows paired GPU counter calculator and safe adapter reads
        run: dotnet run --project tools/Cotabby.Tools.GpuSmoke/Cotabby.Tools.GpuSmoke.csproj -c Release

      - name: Verify credential privacy through real Windows UI Automation
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/Cotabby.Tools.CredentialSmoke/Cotabby.Tools.CredentialSmoke.csproj -c Release -p:EnableWindowsTargeting=true -- --allow-harness-skip
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Output 'CREDENTIAL_UIA_PROOF=PASSED'
          } elseif ($code -eq 4) {
            Write-Output 'CREDENTIAL_UIA_PROOF=SKIPPED_NO_INTERACTIVE_DESKTOP (owner must verify on real Windows)'
          } else {
            throw "Credential UIA proof failed with exit code $code"
          }

      - name: Verify double-tap intent and fixture text through real Windows hooks
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/Cotabby.Tools.DoubleTapSmoke/Cotabby.Tools.DoubleTapSmoke.csproj -c Release -p:EnableWindowsTargeting=true
          if ($LASTEXITCODE -ne 0) { throw "Double-tap hook proof failed with exit code $LASTEXITCODE" }
          Write-Output 'DOUBLETAP_HOOK_FIXTURE_PROOF=PASSED (fixture adapter; not production SendInputTextInserter or physical keys)'

      - name: Publish self-contained Windows x64 folder
        run: >-
          dotnet publish src/Cotabby.App/Cotabby.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o artifacts/Cotabby-win-x64

      - name: Verify tests and package provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          [xml]$trx = Get-Content -Raw artifacts/test-results/core-tests.trx
          $counts = $trx.TestRun.ResultSummary.Counters
          if ([int]$counts.total -le 0 -or [int]$counts.total -ne [int]$counts.passed -or
              [int]$counts.executed -ne [int]$counts.total) { throw 'Not all tests passed/executed' }
          $root = (Resolve-Path artifacts/Cotabby-win-x64).Path
          @(
            ('SourceCommit=' + $source)
            'BuildKind=Development/test build; not a tagged release'
            ('TestsPassed=' + $counts.passed)
            'LiveModelInference=Not tested; owner validation required'
          ) | Set-Content -LiteralPath (Join-Path $root BUILD-INFO.txt) -Encoding utf8
          Copy-Item docs/upstream-output-budget.md (Join-Path $root OUTPUT-BUDGET-NOTES.md)
          Copy-Item docs/upstream-performance-metrics.md (Join-Path $root PERFORMANCE-NOTES.md)
          Copy-Item docs/upstream-credential-fields.md (Join-Path $root FEATURE-NOTES.md)
          @(
            'Cotabby Windows feature test build'
            'Extract the complete ZIP into a NEW folder. Run Cotabby.exe as a standard user.'
            'Keep runtimes/win-x64 beside the executable. No .NET installation is required.'
            'This build uses your existing Cotabby settings and model cache.'
            'Test tabby-2-nano first, then tabby-2-plus when memory permits.'
            'Try single-line and multi-line completion, the longest length preset, and a mid-line caret.'
            'Open Settings > Performance. Wait at least two samples; unknown GPU fields show a dash.'
            'Compare GPU readouts with Task Manager while generating suggestions; per-adapter behavior needs live proof.'
            'Enable request tracking, generate a suggestion, verify a latency row, then Clear and restart.'
            'Disable tracking and verify new requests add no rows. Confirm the toggle persists after restart.'
            'Switch away from Performance and close Settings; GPU sampling must stop.'
            'Credential protection: use dummy values only. Username, verification, card and password inputs should receive no suggestions.'
            'Ordinary writing, email subjects and document-style email bodies should still work.'
            'Browser accessibility metadata varies; this is not complete DOM/autofill parity.'
            'Check C:\tmp\cotabby-live.log for Model ... loaded and Constrained decode.'
            'Do not share the raw log: it can contain your typed text and local paths.'
            'CI proves tests, compilation, packaging, native loading and synthetic Windows UIA credential guards.'
            'Real model decoding, UI suggestions, and GPU behavior still require owner testing.'
          ) | Set-Content -LiteralPath (Join-Path $root README-TEST.txt) -Encoding utf8
          $records = @(Get-ChildItem $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          ConvertTo-Json -InputObject $records -Depth 4 | Set-Content (Join-Path $root PACKAGE-MANIFEST.json) -Encoding utf8
          Write-Output "WINDOWS_TESTS_PASSED=$($counts.passed) SOURCE_COMMIT=$source"

      - name: ZIP, extract, and verify every packaged byte
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD artifacts/Cotabby-win-x64.zip
          Compress-Archive -Path artifacts/Cotabby-win-x64/* -DestinationPath $zip
          $extract = Join-Path $env:RUNNER_TEMP cotabby-package-proof
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $records = Get-Content -Raw (Join-Path $extract PACKAGE-MANIFEST.json) | ConvertFrom-Json
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($record in $records) {
            if (-not $seen.Add($record.path)) { throw 'Duplicate manifest member' }
            $path = Join-Path $extract $record.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing member: $($record.path)" }
            if ((Get-Item -LiteralPath $path).Length -ne $record.bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $record.sha256) {
              throw "Member hash/size mismatch: $($record.path)"
            }
          }
          $files = @(Get-ChildItem $extract -Recurse -File)
          if ($files.Count -ne $seen.Count + 1) { throw 'Unlisted package member' }
          foreach ($required in @('Cotabby.exe', 'Cotabby.Core.dll', 'Cotabby.Inference.dll',
              'Cotabby.runtimeconfig.json', 'BUILD-INFO.txt', 'README-TEST.txt',
              'runtimes/win-x64/native/noavx/llama.dll', 'runtimes/win-x64/native/noavx/ggml.dll',
              'runtimes/win-x64/native/noavx/ggml-base.dll', 'runtimes/win-x64/native/noavx/ggml-cpu.dll',
              'runtimes/win-x64/native/vulkan/llama.dll', 'runtimes/win-x64/native/vulkan/ggml-vulkan.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $required) -PathType Leaf)) { throw "Missing required file: $required" }
          }
          if (@($files | Where-Object { $_.Extension -in @('.gguf', '.log', '.env') }).Count -ne 0) {
            throw 'Forbidden model/log/secret artifact'
          }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Cotabby-win-x64.zip" | Set-Content artifacts/Cotabby-win-x64.zip.sha256 -Encoding ascii
          Write-Output "WINDOWS_PACKAGE_VERIFIED=$($files.Count) ZIP_SHA256=$sha"

      - name: Load extracted CPU native runtime without a model
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class CotabbyNativePackageProbe {
            [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryExW(string path, IntPtr reserved, uint flags);
            [DllImport("kernel32", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $dll = Join-Path $env:RUNNER_TEMP cotabby-package-proof/runtimes/win-x64/native/noavx/llama.dll
          $handle = [CotabbyNativePackageProbe]::LoadLibraryExW($dll, [IntPtr]::Zero, 0x1100)
          if ($handle -eq [IntPtr]::Zero) { throw "Native CPU load failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          if (-not [CotabbyNativePackageProbe]::FreeLibrary($handle)) { throw 'Native CPU unload failed' }
          Write-Output 'WINDOWS_CPU_NATIVE_LOAD_PASSED (no model or GPU inference exercised)'

      - name: Check diff whitespace
        run: git diff --check

      - name: Upload verified Windows test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cotabby-win-x64-test
          path: |
            artifacts/Cotabby-win-x64.zip
            artifacts/Cotabby-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cotabby-windows-test-evidence
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14
